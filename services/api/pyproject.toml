[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "viral-dna-api"
version = "0.1.0"
description = "ViralDNA Phase 1 analysis orchestration API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "yt-dlp>=2026.3.17,<2027"
]

[project.optional-dependencies]
local-ai = [
  "faster-whisper>=1.2,<2",
  "onnxruntime>=1.20,<2",
  "rapidocr>=3.8,<4"
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/viral_dna_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
