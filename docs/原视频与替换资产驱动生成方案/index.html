<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ViralDNA · 全场景深度驱动视频重建</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #252330; background: #f5f5fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1080px, calc(100% - 32px)); margin: 48px auto; }
    header, section { border: 1px solid #e1dff0; border-radius: 18px; background: #fff; }
    header { padding: 36px; }
    section { margin-top: 16px; padding: 24px; }
    .eyebrow { color: #5b4cf0; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 10px 0 12px; font-size: clamp(30px, 5vw, 48px); line-height: 1.12; }
    h2 { margin: 0 0 14px; font-size: 22px; }
    p { color: #6f6a7c; line-height: 1.7; }
    .flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
    .flow div { min-height: 116px; padding: 16px; border-radius: 13px; color: #403a78; background: #f4f2ff; font-weight: 700; }
    .sources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .sources article { padding: 16px; border: 1px solid #e6e3ef; border-radius: 13px; }
    .sources strong { display: block; margin-bottom: 6px; }
    @media (max-width: 760px) { .flow, .sources { grid-template-columns: 1fr; } header { padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">VIRALDNA · PHASE 2</div>
      <h1>全场景深度驱动视频重建</h1>
      <p>不再抽取单个人形轮廓。系统从原始分镜生成逐帧完整深度，再让人物、场景、服装和产品资产分别提供可控外观。</p>
      <div class="flow">
        <div>01<br />原始分镜</div><div>02<br />全场景深度</div><div>03<br />人物身份</div><div>04<br />外观资产</div><div>05<br />新视频</div>
      </div>
    </header>
    <section>
      <h2>来源边界</h2>
      <div class="sources">
        <article><strong>人物身份</strong><p>决定脸部、年龄感和稳定人物特征。</p></article>
        <article><strong>外观资产</strong><p>决定场景、服装、产品、颜色和材质。</p></article>
        <article><strong>全场景深度</strong><p>只决定动作、空间、遮挡和镜头关系。</p></article>
      </div>
    </section>
    <section>
      <h2>实现原则</h2>
      <p>模型能力决定请求路由；缺少必需深度时阻止生成；不支持深度的模型不会收到深度文件。旧人物轮廓代理、旧字段和旧 API 已从当前实现移除。</p>
    </section>
  </main>
</body>
</html>
